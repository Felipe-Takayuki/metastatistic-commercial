[project]
name = "data-engine-service"
version = "0.1.0"
description = "Data Engine Microservice: DuckDB SQL sandbox, Arrow IPC streaming, PII Masking and Connectors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "polars>=1.6.0",
    "sqlglot>=25.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
