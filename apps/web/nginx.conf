server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /api/* -> FastAPI (a barra final remove o prefixo /api)
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    client_max_body_size 200m;     # igual ao MAX_UPLOAD_MB da API
    proxy_read_timeout 240s;       # fila (até 90 s) + análise (até 60 s) + recriação do motor
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
