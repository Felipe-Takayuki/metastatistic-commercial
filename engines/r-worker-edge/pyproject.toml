[project]
name = "metastatistic-r-worker-edge"
version = "0.1.0"
description = "Borda do worker R remoto: token + sincronização de datasets + proxy"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
