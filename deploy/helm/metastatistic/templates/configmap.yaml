apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metastatistic.fullname" . }}-config
  labels:
    {{- include "metastatistic.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  AUTH_SERVICE_URL: "http://{{ include "metastatistic.fullname" . }}-auth:{{ .Values.authTenantService.service.port }}"
  STAT_ORCHESTRATOR_URL: "http://{{ include "metastatistic.fullname" . }}-stat-orchestrator:{{ .Values.statOrchestrator.service.port }}"
  DATA_ENGINE_SERVICE_URL: "http://{{ include "metastatistic.fullname" . }}-data-engine:{{ .Values.dataEngineService.service.port }}"
  BI_REPORT_SERVICE_URL: "http://{{ include "metastatistic.fullname" . }}-bi-report:{{ .Values.biReportService.service.port }}"
  EXPORT_SERVICE_URL: "http://{{ include "metastatistic.fullname" . }}-export:{{ .Values.exportService.service.port }}"
  BILLING_SERVICE_URL: "http://{{ include "metastatistic.fullname" . }}-billing:{{ .Values.billingService.service.port }}"
  AUDIT_SERVICE_URL: "http://{{ include "metastatistic.fullname" . }}-audit:{{ .Values.auditService.service.port }}"
  R_WORKER_URL: "http://{{ include "metastatistic.fullname" . }}-r-worker:{{ .Values.rWorker.service.port }}"
