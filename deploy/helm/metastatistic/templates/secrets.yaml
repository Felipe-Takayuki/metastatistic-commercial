apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metastatistic.fullname" . }}-secrets
  labels:
    {{- include "metastatistic.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_PUBLISHABLE_KEY: {{ .Values.secrets.stripePublishableKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
