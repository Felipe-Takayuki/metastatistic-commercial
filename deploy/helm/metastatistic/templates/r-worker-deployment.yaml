apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metastatistic.fullname" . }}-r-worker
  labels:
    {{- include "metastatistic.labels" . | nindent 4 }}
    app.kubernetes.io/component: r-worker
spec:
  replicas: {{ .Values.rWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "metastatistic.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: r-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "metastatistic.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: r-worker
    spec:
      containers:
        - name: r-worker
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.rWorker.image.repository }}:{{ .Values.rWorker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.rWorker.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "metastatistic.fullname" . }}-config
            - secretRef:
                name: {{ include "metastatistic.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rWorker.resources | nindent 12 }}
