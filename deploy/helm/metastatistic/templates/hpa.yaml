{{- if .Values.autoscaling.enabled -}}
{{- $root := . -}}
{{- range $component := list "gateway" "auth-tenant-service" "stat-orchestrator" "data-engine-service" "bi-report-service" "export-service" "billing-service" "audit-service" "r-worker" }}
{{- $cfg := index $root.Values (hasPrefix "auth" $component | ternary "authTenantService" (hasPrefix "stat" $component | ternary "statOrchestrator" (hasPrefix "data" $component | ternary "dataEngineService" (hasPrefix "bi" $component | ternary "biReportService" (hasPrefix "export" $component | ternary "exportService" (hasPrefix "billing" $component | ternary "billingService" (hasPrefix "audit" $component | ternary "auditService" (hasPrefix "r-" $component | ternary "rWorker" "gateway")))))))) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "metastatistic.fullname" $root }}-{{ $component }}
  labels:
    {{- include "metastatistic.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "metastatistic.fullname" $root }}-{{ $component }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
{{- end }}
