apiVersion: v1
kind: Service
metadata:
  name: {{ include "metastatistic.fullname" . }}-export
  labels:
    {{- include "metastatistic.labels" . | nindent 4 }}
    app.kubernetes.io/component: export-service
spec:
  type: {{ .Values.exportService.service.type }}
  ports:
    - port: {{ .Values.exportService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "metastatistic.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: export-service
