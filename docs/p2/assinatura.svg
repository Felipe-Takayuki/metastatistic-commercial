<svg xmlns="http://www.w3.org/2000/svg" width="900" height="636" viewBox="0 0 900 636">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"/></marker></defs>
<rect width="900" height="636" fill="white"/>
<rect x="8" y="8" width="104" height="36" rx="4" fill="#fff3dc" stroke="#b96f1f"/><text x="60" y="22" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#222">Usuário</text><text x="60" y="34" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#222">(admin da org)</text><line x1="60" y1="48" x2="60" y2="610" stroke="#bbb" stroke-dasharray="4,4"/><rect x="158" y="8" width="104" height="36" rx="4" fill="#fff3dc" stroke="#b96f1f"/><text x="210" y="22" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#222">App web</text><text x="210" y="34" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#222">+ gateway</text><line x1="210" y1="48" x2="210" y2="610" stroke="#bbb" stroke-dasharray="4,4"/><rect x="308" y="8" width="104" height="26" rx="4" fill="#fff3dc" stroke="#b96f1f"/><text x="360" y="22" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#222">billing-service</text><line x1="360" y1="48" x2="360" y2="610" stroke="#bbb" stroke-dasharray="4,4"/><rect x="458" y="8" width="104" height="26" rx="4" fill="#fff3dc" stroke="#b96f1f"/><text x="510" y="22" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#222">Stripe</text><line x1="510" y1="48" x2="510" y2="610" stroke="#bbb" stroke-dasharray="4,4"/><rect x="598" y="8" width="104" height="26" rx="4" fill="#fff3dc" stroke="#b96f1f"/><text x="650" y="22" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#222">auth-tenant</text><line x1="650" y1="48" x2="650" y2="610" stroke="#bbb" stroke-dasharray="4,4"/><rect x="738" y="8" width="104" height="26" rx="4" fill="#fff3dc" stroke="#b96f1f"/><text x="790" y="22" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#222">apps/api</text><line x1="790" y1="48" x2="790" y2="610" stroke="#bbb" stroke-dasharray="4,4"/><line x1="60" y1="72" x2="210" y2="72" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="135.0" y="68" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">1. clica em “Assinar o Pro”</text><line x1="210" y1="112" x2="360" y2="112" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="285.0" y="108" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">2. POST /billing/checkout (admin da org)</text><line x1="360" y1="152" x2="510" y2="152" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="435.0" y="148" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">3. cria Checkout Session (subscription, R$ 249/mês)</text><line x1="510" y1="192" x2="360" y2="192" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="435.0" y="188" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">4. session.url</text><line x1="360" y1="232" x2="60" y2="232" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="210.0" y="228" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">5. redireciona ao Stripe (via app)</text><line x1="60" y1="272" x2="510" y2="272" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="285.0" y="268" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">6. paga com cartão de teste 4242…</text><line x1="510" y1="312" x2="360" y2="312" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="435.0" y="308" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">7. webhook checkout.session.completed (+ Stripe-Signature)</text><path d="M360,352 h38 v14 h-38" fill="none" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="404" y="362" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">8. valida assinatura; claim do event.id (idempotência)</text><line x1="360" y1="392" x2="650" y2="392" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="505.0" y="388" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">9. PATCH /tenants/{id}/tier = team</text><line x1="510" y1="432" x2="360" y2="432" stroke="#444" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="435.0" y="428" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">10. reentrega do mesmo evento → 200, duplicate=true, sem efeito</text><line x1="60" y1="472" x2="790" y2="472" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="425.0" y="468" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">11. envia dataset (X-Tenant-ID)</text><line x1="210" y1="512" x2="790" y2="512" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="500.0" y="508" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">12. gateway repassa X-Tenant-Tier / Quotas verificados</text><line x1="790" y1="552" x2="60" y2="552" stroke="#444" stroke-width="1.3" marker-end="url(#a)"/><text x="425.0" y="548" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">13. dentro do limite: 201 · acima: 402 + como liberar</text><text x="450" y="602" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">Cancelamento: portal “Gerenciar assinatura” → Stripe envia customer.subscription.deleted → billing rebaixa a org para Free (tier community).</text><text x="450" y="618" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9"  fill="#222">Pagamento recusado: invoice.payment_failed → assinatura past_due (o plano segue enquanto o Stripe retenta).</text>
</svg>